<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Wishweave Wonders — connected road preview</title>
<link rel="stylesheet" href="style.css">
<style> #hud .race-thread, #hud .hud-results, #hud .hud-hint { display: none; } </style>
</head>
<body>
<div id="app">
  <canvas id="view"></canvas>
  <main id="game">
    <div id="hud" class="hud">
      <img class="hud-logo" src="assets/ui/logo.webp" alt="Wishweave Wonders" draggable="false">
      <div class="pill hud-phase" id="hud-phase">LEVEL 1 · START</div>
      <div class="hud-counts">
        <div class="pill hud-count purl" id="hud-purl" aria-label="Purl threads held">
          <svg class="flower" viewBox="0 0 40 40" aria-hidden="true"><use href="#ico-flower"/></svg>
          <span class="who">PURL</span><span class="num"><b>0</b>&#8202;/&#8202;3</span>
        </div>
        <div class="pill hud-count loop" id="hud-loop" aria-label="Loop threads held (computer rival)">
          <svg class="flower" viewBox="0 0 40 40" aria-hidden="true"><use href="#ico-flower"/></svg>
          <span class="who">LOOP</span><span class="num"><b>0</b>&#8202;/&#8202;3</span>
        </div>
      </div>
      <div class="pill hud-objective" id="hud-objective" role="status" aria-live="polite">
        <span class="txt">UNFURL THE RIBBON</span>
        <svg class="flag" viewBox="0 0 40 40" aria-hidden="true"><use href="#ico-flag"/></svg>
      </div>
      <div class="race-thread" id="race-thread" aria-hidden="true">
        <i class="bead loop"></i><i class="bead purl"></i>
      </div>
      <div class="hud-results" id="hud-results" hidden>
        <div class="pill result-title"><svg class="orn l" viewBox="0 0 40 40" aria-hidden="true"><use href="#ico-flower"/></svg>LEVEL 1 COMPLETE<svg class="orn r" viewBox="0 0 40 40" aria-hidden="true"><use href="#ico-flower"/></svg></div>
        <div class="pill result-ranks" id="result-ranks"></div>
        <div class="pill result-times" id="result-times"></div>
        <div class="result-wait" id="result-wait" hidden>Loop is still racing<span class="dots"><i>.</i><i>.</i><i>.</i></span></div>
      </div>
      <div class="hud-hint" id="hud-hint" hidden></div>
    </div>


    <button id="btn-pause" class="btn-pause" type="button" aria-label="Pause"></button>
    <div id="rewards" class="rewards">
      <span class="rw-label">SAVED REWARDS</span>
      <span class="rw-bar" aria-hidden="true"><i></i></span>
      <span class="rw-slot" aria-hidden="true"></span><span class="rw-slot" aria-hidden="true"></span>
      <button id="btn-cashout" class="btn-cashout" type="button" aria-disabled="true"
              aria-label="Cash out (locked placeholder, no real money)">
        <svg class="lock" viewBox="0 0 24 24" aria-hidden="true"><use href="#ico-lock"/></svg><span>CASH OUT</span>
      </button>
    </div>

  </main>
</div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <radialGradient id="g-petal" cx="50%" cy="38%" r="70%">
      <stop offset="0" stop-color="#ffe9a6"/><stop offset=".55" stop-color="#f5b93c"/><stop offset="1" stop-color="#d48a1a"/>
    </radialGradient>
    <symbol id="ico-flower" viewBox="0 0 40 40">
      <g stroke="#b06d12" stroke-width="1.6" stroke-linejoin="round" fill="url(#g-petal)">
        <path d="M20 2.5c3.2 0 4.6 4.6 4.3 8.6 3.6-1.9 8.4-2.4 9.4.7 1 3.1-3 5.8-6.8 7.1 3 2.6 5.5 6.8 2.9 8.7-2.6 1.9-6.3-1.3-8.4-4.7-1.4 3.8-4.4 7.7-7.1 5.8-2.6-1.9-.5-6.3 2.1-8.9-3.9-.9-8-3.3-7-6.4 1-3.1 5.8-2.9 9.5-1.1C18.6 8.4 16.8 2.5 20 2.5z"/>
      </g>
      <circle cx="20" cy="19.5" r="4.2" fill="#ffd970" stroke="#b06d12" stroke-width="1.4"/>
      <path d="M16.5 14.5c1.5-1.3 3.2-1.6 4.8-1" stroke="#fff6cf" stroke-width="1.4" fill="none" stroke-linecap="round" opacity=".8"/>
    </symbol>
    <symbol id="ico-flag" viewBox="0 0 40 40">
      <path d="M9 5v32" stroke="#3d2416" stroke-width="2.6" stroke-linecap="round"/>
      <path d="M10 6.5c7-3 12 3.5 21-.5v15c-9 4-14-2.5-21 .5z" fill="#fffaf0" stroke="#3d2416" stroke-width="1.8" stroke-linejoin="round"/>
      <path d="M10 6.5c2.3-1 4.3-1 6.2-.5v5c-1.9-.5-3.9-.5-6.2.5zM16.2 11c2 .5 3.9 1.4 6 1.8v5c-2.1-.4-4-1.3-6-1.8zM22.2 7.2c2.6.5 5.3.4 8.8-1.2v5c-3.5 1.6-6.2 1.7-8.8 1.2zM10 16.5c2.3-1 4.3-1 6.2-.5V21c-1.9-.5-3.9-.5-6.2.5zM22.2 17.8c2.6.5 5.3.4 8.8-1.2"
            fill="#3d2416"/>
    </symbol>
    <symbol id="ico-lock" viewBox="0 0 24 24">
      <path d="M7.5 11V8.2a4.5 4.5 0 0 1 9 0V11" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
      <rect x="5" y="10.5" width="14" height="10.5" rx="2.4" fill="currentColor"/>
      <circle cx="12" cy="15.3" r="1.6" fill="#8f877b"/>
    </symbol>
  </defs>
</svg>


<!-- Preview harness for the connected world (not part of the game build). -->
<script src="vendor/three.min.js"></script>
<script src="src/core/ww.js"></script>
<script src="src/core/path.js"></script>
<script src="src/data/asset-data.js"></script>
<script src="src/data/plates/p01.js"></script>
<script src="src/data/plates/p02.js"></script>
<script src="src/data/plates/p03.js"></script>
<script src="src/data/plates/p04.js"></script>
<script src="src/data/plates/p06.js"></script>
<script src="src/data/plates/p07.js"></script>
<script src="src/data/level.js"></script>
<script src="src/data/world-layout.js"></script>
<script src="src/world/build.js"></script>
<script src="src/render/world3d.js"></script>
<script>
(function () {
  const params = new URLSearchParams(location.search);
  const extra = { 'world.carpet-p01': 'assets/world/carpet-p01.webp', 'world.carpet-p02': 'assets/world/carpet-p02.webp',
                  'world.braid': 'assets/world/braid.webp', 'world.knit': 'assets/world/knit.webp',
                  'world.sky-0': 'assets/world/sky-0.webp', 'world.sky-1': 'assets/world/sky-1.webp' };
  const list = Object.keys(WW.ASSETS.images).map(k => [k, WW.ASSETS.images[k].file]).concat(Object.entries(extra));
  Promise.all(list.map(([k, src]) => new Promise((res, rej) => { const im = new Image(); im.onload = () => res([k, im]); im.onerror = () => rej(src); im.src = src; })))
  .then(pairs => {
    const images = Object.fromEntries(pairs);
    const world = WW.world.build({ areas: ['p01', 'p02'] });
    const canvas = document.getElementById('view');
    const r = WW.render3d.createRenderer({ canvas, images, assets: WW.ASSETS, world, debug: params.get('debug') === 'geom' });
    const game = document.getElementById('game');
    function layout() { r.resize(innerWidth, innerHeight, devicePixelRatio); game.style.setProperty('--k', (innerWidth / 841).toFixed(4)); }
    layout();
    addEventListener('resize', layout);
    const total = world.length;
    // Place Purl at distance d along the course (Loop a little behind in his lane) and draw one frame.
    function at(d, o) {
      o = o || {};
      d = Math.max(0, Math.min(total - 1e-6, d));
      let i = 0; while (i < world.segs.length - 1 && d > world.segs[i].start + world.segs[i].length) i++;
      const seg = world.segs[i];
      const ld = Math.max(0, Math.min(total - 1e-6, d + (o.loopAhead !== undefined ? o.loopAhead : 1.4)));
      let j = 0; while (j < world.segs.length - 1 && ld > world.segs[j].start + world.segs[j].length) j++;
      const state = { mode: o.mode || 'running', time: 1, purl: { seg: i, f: (d - seg.start) / seg.length, laneX: o.laneX || 0, lane: o.lane || 0, jumpH: o.jumpH || 0,
                       speed: 1.6, distance: d, action: o.action || 'run' },
                       loop: { seg: j, f: (ld - world.segs[j].start) / world.segs[j].length, laneX: 1.7, lane: 1.7, jumpH: 0, speed: 1.6, distance: ld + 0.6, action: 'run' } };
      if (o.overhead) r.renderOverhead(state); else r.render(state, 1 / 60);
      return { seg: seg.id, f: state.purl.f, cam: r.getCameraPose() };
    }
    window.preview = { at, total, world, renderer: r, segs: world.segs.map(s => ({ id: s.id, kind: s.kind, start: s.start, length: s.length })) };
    at(0);
    window.previewReady = true;
  }).catch(e => { document.body.insertAdjacentHTML('beforeend', '<pre style="position:fixed;top:0;color:red;z-index:99">' + e + '</pre>'); });
})();
</script>
</body>
</html>
